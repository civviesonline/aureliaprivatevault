spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: ${SMTP_PROTOCOL:smtp}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: 8080

app:
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:}
    from-name: ${SENDGRID_FROM_NAME:YourApp}
  otp:
    expiry-minutes: 5
    max-attempts: 5
    rate-limit-max: 3
    rate-limit-window-minutes: 10
  frontend:
    url: ${FRONTEND_URL:http://localhost:5174}
    urls: ${FRONTEND_URLS:http://localhost:5174,http://localhost:5173}
  mail:
    smtp-fallback-enabled: true
    smtp-from-email: ${SMTP_FROM_EMAIL:${SENDGRID_FROM_EMAIL:}}
    smtp-from-name: ${SMTP_FROM_NAME:${SENDGRID_FROM_NAME:YourApp}}
  session:
    cookie-name: ${SESSION_COOKIE_NAME:AURELIA_SESSION}
    max-age-days: ${SESSION_MAX_AGE_DAYS:30}
    secure: ${SESSION_COOKIE_SECURE:false}
